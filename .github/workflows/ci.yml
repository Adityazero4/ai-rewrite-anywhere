name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        working-directory: apps/macos
        run: make test
      - name: Build the app bundle
        working-directory: apps/macos
        run: make app SIGN_ID=-

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
